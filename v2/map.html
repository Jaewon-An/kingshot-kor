<!doctype html>
<html lang="ko" data-mode="share">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e9ece6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111513" media="(prefers-color-scheme: dark)">
<title>KOR 신규 자리 지도</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/v2/guide.css">
</head>
<body>
<!-- /v2/map 공유용 지도: 자리 배치(번호)와 지도 위치만. 스크립트는 /v2와 같은 v2/guide.js (data-mode="share") -->
<div class="page">
  <header class="top">
    <div>
      <p class="eyebrow">KINGSHOT · 2382 KOR</p>
      <h1>신규 자리 지도</h1>
    </div>
    <dl class="facts" id="facts"></dl>
  </header>

  <p class="notice" id="notice" role="status">지도를 불러오는 중…</p>

  <div class="grid" id="main" hidden>
    <aside class="panel">
      <div class="card" id="card" hidden></div>
      <div class="tbl"><table id="list"></table></div>
      <p class="hint">번호 순서: 곰덫2 1~3줄 → 곰덫1 1~2줄 → 나머지</p>
    </aside>

    <section class="mapcol">
      <div class="mapbar">
        <button class="btn copy" id="link" type="button">링크 복사</button>
        <button class="btn" id="rot" type="button" aria-pressed="true">게임 시점</button>
        <button class="btn" id="lbl" type="button" aria-pressed="true">번호</button>
      </div>
      <div class="mapwrap">
        <canvas id="cv"></canvas>
        <div class="tip" id="tip" hidden></div>
        <div class="zoom">
          <button class="btn" id="zin" type="button" aria-label="확대">＋</button>
          <button class="btn" id="zout" type="button" aria-label="축소">－</button>
          <button class="btn" id="fit" type="button" aria-label="전체 보기">전체</button>
        </div>
        <div class="readout" id="readout" role="status"></div>
      </div>
      <details class="legend" id="legend" open>
        <summary>범례</summary>
        <div class="keys">
          <span><i style="background:var(--c-t2)"></i>곰덫2</span>
          <span><i style="background:var(--c-t1)"></i>곰덫1</span>
          <span><i style="background:var(--c-city2)"></i>곰덫2 참여</span>
          <span><i style="background:var(--c-city1)"></i>곰덫1 참여</span>
          <span><i class="spare"></i>빈자리</span>
          <span><i style="background:var(--c-banner)"></i>깃발</span>
          <span><i style="background:var(--c-res)"></i>연맹 자원</span>
          <span><i style="background:var(--c-hq)"></i>본부</span>
          <span><i style="background:var(--m-node)"></i>자원지</span>
          <span><i style="background:var(--m-mount)"></i>산</span>
          <span><i style="background:var(--m-lake)"></i>호수</span>
        </div>
      </details>
    </section>
  </div>

  <footer><a href="/v2/">신규 자리 배치도</a></footer>
</div>
<script src="/mapdata.js"></script>
<script src="/v2/core.js"></script>
<script src="/v2/plan.js"></script>
<script src="/v2/guide.js"></script>
</body>
</html>
