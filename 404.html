<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>페이지 없음 · KOR 배치도</title>
<style>
  :root { --bg: #e9ece6; --panel: #f6f7f3; --ink: #1b231e; --muted: #5a665e; --line: #cdd5ca; --accent: #94600f; --accent-ink: #fffaf0; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111513; --panel: #181d1a; --ink: #e2e7df; --muted: #97a39a; --line: #2b332e; --accent: #d6a24a; --accent-ink: #1a1408; color-scheme: dark; }
  }
  body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 16px; box-sizing: border-box; background: var(--bg); color: var(--ink);
    font-family: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; }
  main { box-sizing: border-box; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 24px; max-width: 360px; width: 100%; text-align: center; }
  h1 { margin: 0 0 16px; font-size: 1.15rem; }
  a { display: block; padding: 12px; border-radius: 6px; text-decoration: none; font-weight: 600; }
  .go { background: var(--accent); color: var(--accent-ink); }
  .sub { color: var(--muted); margin-top: 6px; }
</style>
</head>
<body>
<main>
  <h1>페이지를 찾을 수 없습니다</h1>
  <a class="go" href="/v2/">신규 자리 배치도</a>
  <a class="sub" href="/v1/">기존 배치도</a>
</main>
</body>
</html>
