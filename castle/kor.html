<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e9ece6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111513" media="(prefers-color-scheme: dark)">
<title>캐슬 도시 배치도 1 · 2</title>
<meta property="og:title" content="킹스 캐슬 도시 배치도">
<meta property="og:description" content="2382 KOR · 킹스 캐슬 둘레 도시 배치도 1 · 2">
<meta name="description" content="2382 KOR · 킹스 캐슬 둘레 도시 배치도 1 · 2">
<style>
  :root { --gap: #cdd5ca; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --gap: #2b332e; } }
  :root[data-theme="dark"] { --gap: #2b332e; }
  html, body { margin: 0; height: 100%; background: var(--gap); }
  /* 가로 화면은 좌우, 세로 화면(휴대폰)은 위아래로 반씩 */
  .both { box-sizing: border-box; display: flex; gap: 4px; height: 100vh; height: 100dvh;
    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
  .both iframe { flex: 1 1 0; min-width: 0; min-height: 0; border: 0; display: block; background: var(--gap); }
  @media (orientation: portrait) { .both { flex-direction: column; } }
</style>
</head>
<body>
<!-- /castle/kor 다른 사람에게 보내는 공유용: 캐슬 배치도 1·2를 한 화면에. 지도 한 장은 /castle/map?p=1|2 (castle/index.html 복사본을 castle.js가 지도만·보기 전용으로 엶), 각각 따로 확대·이동 -->
<main class="both">
  <iframe src="/castle/map?p=1" title="캐슬 도시 배치도 1"></iframe>
  <iframe src="/castle/map?p=2" title="캐슬 도시 배치도 2"></iframe>
</main>
</body>
</html>
